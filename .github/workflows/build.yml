name: Build DeluxeMenus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set build metadata
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BUILD_NUMBER=PR-${{ github.event.pull_request.number }}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=DeluxeMenus-PR-${{ github.event.pull_request.number }}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=build-${{ github.run_number }}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=DeluxeMenus-latest-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Build shaded JAR
        run: ./gradlew clean shadowJar
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: List built JARs
        run: ls -lah build/libs/

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
